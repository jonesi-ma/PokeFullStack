<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="static/PokeInfoStyle.css">
        <title>Pokémon</title>
    </head>
    <body>
        <h1 class="pokelogo">PoKéMoN</h1>
        <h1 class="header">About which Pokémon do you want to receive Information?</h1>

        <!-- Hier kommt der das Eingabefeld, das mit JavaScript die url um /pokemon/{eingabe als var name_or_id} umwandelt;
        im Eingabefeld steht dieser Text: "Please enter name or ID(1-1025, 10001-10326) of a Pokémon!";
        drunter der Button mit "Get Information!"-->

        <!-- Eingabefeld und Button-->
        <div class="search-container">
            <input type="text" id="pokemonInput" placeholder="Please enter name or ID(1-1025, 10001-10326) of a Pokémon!">
            <div id="result-error"></div>
            <button id="submitBtn">Get Information!</button>
        </div>
        <div class="result-container" id="resultBox"></div>
        <script>
            const inputField = document.getElementById("pokemonInput");
            const submitButton = document.getElementById("submitBtn");
            const resultContainer = document.getElementById("resultBox");
            const resultError = document.getElementById("result-error")

            async function executeSearch() {
                const query = inputField.value.trim().toLowerCase();
                if (!query) {
                    resultContainer.innerHTML = "";
                    resultError.innerHTML = `
                    <div class="error-response">Error: Please enter a valid Name or ID.</div>
                    `;
                    return;
                }
                resultError.innerHTML = "";
                resultContainer.innerHTML = "";

                try {
                    const response = await fetch(`https://pokeinfo-qwgm.onrender.com/pokemon/${encodeURIComponent(query)}`);
                    const data = await response.json();

                    if (!response.ok || data.error) {
                        const message = data.error || "Please enter a valid Name or ID."
                        resultError.innerHTML = `
                        <div class="error-response">Error: ${message}</div>
                        `;
                        return;
                    }
                    const moves = data.moves.join(", ");
                    /* resultContainer.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`; */
                    resultContainer.innerHTML = `
                    <div class="poke-card">
                        <div class="card-row">
                            <span class="label"><strong>Name:</strong></span>
                            <span class="value"> ${data.name.charAt(0).toUpperCase() + data.name.slice(1)}</span>
                        </div>
                        <div class="card-row">
                            <span class="label"><strong>ID:</strong></span>
                            <span class="value"> ${data.id}</span>
                        </div>
                        <div class="card-row">
                            <span class="label"><strong>Height:</strong></span>
                            <span class="value"> ${data.height}</span>
                        </div>
                        <div class="card-row">
                            <span class="label"><strong>Weight:</strong></span>
                            <span class="value"> ${data.weight}</span>
                        </div>
                        <div class="card-row">
                            <span class="label"><strong>Moves:</strong></span>
                            <span class="value"> ${moves}</span>
                        </div>
                    </div>
                    `

                }

                catch (error) {
                    console.error("Search failed:", error);
                    resultError.innerHTML = `
                    <div class="error-response">Error: Could not load Pokémon info. Please try again.</div>
                    `
                }
            }

            submitButton.addEventListener("click", executeSearch);
            inputField.addEventListener("keypress", (event) => {
                if (event.key === "Enter") {
                    executeSearch();
                }}
            )
        </script>
    </body>
</html>
